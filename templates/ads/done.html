{% extends 'base.html' %}{% load nyota %}
{% block title %}You're featured!{% endblock %}
{% block content %}<div class="ny-container page-head text-center" style="max-width:600px">
  <div class="pulse-ring mx-auto">{% icon 'verified' %}</div>
  <h2>{{ promo.shop.name }} is now featured!</h2>
  <p class="text-muted">Live on the Nyota home page until {{ promo.ends_at|date:"d M Y" }}.</p>
  <a class="btn btn-ny" href="{% url 'ads:plans' %}">Back to Advertise</a>
</div>{% endblock %}
