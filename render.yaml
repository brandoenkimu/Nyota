services:
  - type: web
    name: nyota
    runtime: python
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: python manage.py migrate --noinput && daphne -b 0.0.0.0 -p $PORT config.asgi:application
    envVars:
      - { key: DEBUG, value: "False" }
      - { key: SECRET_KEY, generateValue: true }
      - { key: DATABASE_URL, fromDatabase: { name: nyota-db, property: connectionString } }
      - { key: SITE_URL, sync: false }
      - { key: ALLOWED_HOSTS, sync: false }
databases:
  - name: nyota-db
    plan: free
