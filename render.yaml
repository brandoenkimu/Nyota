services:
  - type: web
    name: nyota
    runtime: python
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: python manage.py migrate --noinput && daphne -b 0.0.0.0 -p $PORT config.asgi:application
    envVars:
      - { key: DEBUG, value: "False" }
      - { key: SECRET_KEY, generateValue: true }
      # Supabase PostgreSQL connection will be configured privately in Render.
      - { key: DATABASE_URL, sync: false }
      - { key: SITE_URL, sync: false }
      - { key: ALLOWED_HOSTS, sync: false }
      - { key: CSRF_TRUSTED_ORIGINS, sync: false }
      - { key: REDIS_URL, sync: false }
      - { key: COMPANY_NAME, sync: false }
      - { key: COMPANY_DOMAIN, sync: false }
      - { key: MEMBERS_ONLY, value: "True" }
