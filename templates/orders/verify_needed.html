{% block title %}Verify your email{% endblock %}
{% block content %}<div class="ny-container page-head" style="max-width:560px"><div class="glass p-5 text-center"><div class="pulse-ring" style="width:90px;height:90px">{% icon 'mail' 38 %}</div><h2>One quick step</h2>
<p class="text-muted">Please confirm <b>{{ user.email }}</b> before placing an order. It keeps your account and payments safe.</p>
