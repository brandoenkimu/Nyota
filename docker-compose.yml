services:
  db:
    image: postgres:16
    environment: { POSTGRES_DB: nyota, POSTGRES_USER: nyota, POSTGRES_PASSWORD: nyota }
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7
  web:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://nyota:nyota@db:5432/nyota
      REDIS_URL: redis://redis:6379/0
      DEBUG: "False"
      SECURE_SSL_REDIRECT: "False"
      ALLOWED_HOSTS: "localhost,127.0.0.1"
    ports: ["8000:8000"]
    depends_on: [db, redis]
    volumes: [media:/app/media]
  worker:
    build: .
    env_file: .env
    environment: { DATABASE_URL: "postgres://nyota:nyota@db:5432/nyota", REDIS_URL: "redis://redis:6379/0", DEBUG: "False" }
    command: celery -A config worker -B -l info
    depends_on: [db, redis]
volumes: { pgdata: {}, media: {} }
