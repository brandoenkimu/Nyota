services:
  # The site itself. Serves HTTP and the live-chat WebSocket from the same ASGI process (Daphne) --
  # this needs a host that keeps a process running, which is why this is Render, not a serverless
  # platform like Vercel (see the deployment guide).
  - type: web
    name: nyota
    runtime: python
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: python manage.py migrate --noinput && daphne -b 0.0.0.0 -p $PORT config.asgi:application
    envVars:
      - { key: DEBUG, value: "False" }
      - { key: SECRET_KEY, generateValue: true }
      # Uses the Render-managed PostgreSQL database declared below.
      - { key: DATABASE_URL, fromDatabase: { name: nyota-db, property: connectionString } }
      - { key: SITE_URL, sync: false }
      - { key: ALLOWED_HOSTS, sync: false }
      - { key: CSRF_TRUSTED_ORIGINS, sync: false }
      # Optional: configure when Redis-backed background jobs are deployed.
      - { key: REDIS_URL, sync: false }
      - { key: COMPANY_NAME, sync: false }
      - { key: COMPANY_DOMAIN, sync: false }
      - { key: MEMBERS_ONLY, value: "True" }

databases:
  - name: nyota-db
    plan: free
